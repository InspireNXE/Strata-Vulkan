name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The adapter builds with Strata's convention plugins from build-logic. Only that folder is checked out, so
      # settings.gradle finds no whole Strata checkout and takes strata_version from Maven Central.
      - uses: actions/checkout@v4
        with:
          path: Strata-Vulkan

      - uses: actions/checkout@v4
        with:
          repository: InspireNXE/Strata
          path: Strata
          sparse-checkout: build-logic/
          sparse-checkout-cone-mode: false

      # The tests draw on a device: Mesa's software rasterizer, with the validation layer watching every call, and
      # the DejaVu fonts the system fonts are looked up from
      - name: Install a Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers fonts-dejavu-core

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: Strata-Vulkan
        run: ./gradlew build
        env:
          STRATA_VULKAN_REQUIRE_DEVICE: 'true'

      # Every push to a branch, and every manual run on one, publishes its -SNAPSHOT version to Central's snapshot repository
      - name: Publish a snapshot
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        working-directory: Strata-Vulkan
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # A tag such as v0.1.0 releases that version to Maven Central
      - name: Publish a release
        if: github.ref_type == 'tag'
        working-directory: Strata-Vulkan
        run: ./gradlew publishAndReleaseToMavenCentral -Pversion="${GITHUB_REF_NAME#v}"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
